name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment URL'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - dev
      browser:
        description: 'Browser to run tests on (chrome, firefox, webkit)'
        required: true
        type: choice
        options:
          - chrome
          - firefox
          - webkit
          - safari
          - edge
          - chromium
          - brave
          - opera


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build & Install
        run: mvn -B install -D skipTests --no-transfer-progress
      - name: Ensure browsers are installed
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
      - name: Run tests
        run: mvn test -PeventBooking -Dbrowser=${{github.event.inputs.browser}} -Denv=${{github.event.inputs.environment}}